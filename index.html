<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Money App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .notification { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(-150%); }
        .notification.show { transform: translateY(0); }
    </style>
</head>
<body class="p-4 relative h-screen overflow-hidden">
    
    <!-- Всплывающая карточка сигнала -->
    <div id="notificationBanner" class="notification absolute top-4 left-4 right-4 bg-green-600 rounded-xl p-4 shadow-2xl z-50">
        <h3 class="font-bold text-lg text-white mb-1">🔥 Новый Сигнал!</h3>
        <p id="matchName" class="font-bold text-xl text-white"></p>
        <div class="mt-2 bg-green-800 rounded-lg p-2.5 space-y-1">
            <p id="betDetails" class="text-sm font-medium text-white"></p>
            <p id="betAmount" class="text-sm font-bold text-yellow-300"></p>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <h1 class="text-2xl font-bold mb-6 text-center text-green-500 mt-4">Smart Money</h1>
    
    <div class="bg-gray-800 rounded-xl p-6 text-center border border-gray-700">
        <div class="animate-pulse w-12 h-12 bg-green-500 rounded-full mx-auto mb-4 opacity-20"></div>
        <h2 class="text-lg font-semibold text-gray-300">Ожидание сигналов...</h2>
        <p class="text-sm text-gray-500 mt-2">Не закрывай приложение. Сигнал появится на этом экране моментально.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Универсальное подключение (работает и на ПК, и в телефоне)
        const socket = io(); 

        socket.on('new_signal', (data) => {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            
            document.getElementById('matchName').innerText = data.match;
            document.getElementById('betDetails').innerText = `Ставка: ${data.bet} | КФ: ${data.odds}`;
            document.getElementById('betAmount').innerText = `💰 Сумма: ${data.amount}`;
            
            const banner = document.getElementById('notificationBanner');
            banner.classList.add('show');
            
            setTimeout(() => {
                banner.classList.remove('show');
            }, 12000);
        });
    </script>
</body>
</html>
