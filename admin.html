<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель Smart Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-4 font-sans min-h-screen">
    <div class="max-w-lg mx-auto mt-4">
        
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-green-400">⚡ Smart Money Admin</h1>
            <span id="status" class="text-xs bg-gray-800 px-3 py-1.5 rounded-full text-gray-400 border border-gray-700">Подключение...</span>
        </div>

        <!-- Переключатель вкладок в админке -->
        <div class="flex bg-gray-800 rounded-xl p-1 mb-6 border border-gray-700">
            <button onclick="switchTab('send')" id="tabBtnSend" class="w-1/2 py-2.5 rounded-lg font-bold text-sm bg-green-500 text-black transition">
                🚀 Новый сигнал
            </button>
            <button onclick="switchTab('history')" id="tabBtnHistory" class="w-1/2 py-2.5 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition">
                📋 История (<span id="adminHistoryCount">0</span>)
            </button>
        </div>

        <!-- ВКЛАДКА 1: ОТПРАВКА СИГНАЛА -->
        <div id="viewSend" class="bg-gray-800 rounded-xl p-6 shadow-xl border border-gray-700">
            <h2 class="text-lg font-semibold mb-4 text-gray-200">Параметры сигнала</h2>
            <div class="space-y-4">
                <input type="text" id="match" placeholder="Матч (например: Реал - Барселона)" class="w-full bg-gray-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="bet" placeholder="Исход (например: П1 или ТБ 2.5)" class="w-full bg-gray-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="odds" placeholder="Коэффициент (например: 1.85)" class="w-full bg-gray-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="amount" placeholder="Сумма ставки (например: 5000 ₽ или 5%)" class="w-full bg-gray-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-green-500">

                <button id="sendBtn" class="w-full bg-green-500 hover:bg-green-600 text-black font-bold py-3.5 rounded-lg mt-2 transition shadow-lg">
                    🚀 ОТПРАВИТЬ ВСЕМ
                </button>
            </div>
        </div>

        <!-- ВКЛАДКА 2: УПРАВЛЕНИЕ ИСТОРИЕЙ И РАСЧЕТ СТАВОК -->
        <div id="viewHistory" class="hidden space-y-4">
            <div id="adminHistoryList" class="space-y-3"></div>
        </div>

    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            const st = document.getElementById('status');
            st.innerText = '🟢 Онлайн';
            st.className = 'text-xs bg-green-500/10 px-3 py-1.5 rounded-full text-green-400 border border-green-500/30';
        });

        function switchTab(tab) {
            const viewSend = document.getElementById('viewSend');
            const viewHistory = document.getElementById('viewHistory');
            const btnSend = document.getElementById('tabBtnSend');
            const btnHistory = document.getElementById('tabBtnHistory');

            if (tab === 'send') {
                viewSend.classList.remove('hidden');
                viewHistory.classList.add('hidden');
                btnSend.className = 'w-1/2 py-2.5 rounded-lg font-bold text-sm bg-green-500 text-black transition';
                btnHistory.className = 'w-1/2 py-2.5 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition';
            } else {
                viewSend.classList.add('hidden');
                viewHistory.classList.remove('hidden');
                btnSend.className = 'w-1/2 py-2.5 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition';
                btnHistory.className = 'w-1/2 py-2.5 rounded-lg font-bold text-sm bg-green-500 text-black transition';
            }
        }

        // Отправка сигнала
        document.getElementById('sendBtn').addEventListener('click', () => {
            const match = document.getElementById('match').value;
            const bet = document.getElementById('bet').value;
            const odds = document.getElementById('odds').value;
            const amount = document.getElementById('amount').value;

            if(!match || !bet || !odds || !amount) return alert("Заполни все поля!");

            socket.emit('send_signal', { match, bet, odds, amount });
            
            document.getElementById('match').value = '';
            document.getElementById('bet').value = '';
            document.getElementById('odds').value = '';
            document.getElementById('amount').value = '';

            // Переключаем сразу во вкладку истории, чтобы видеть отправленный сигнал
            switchTab('history');
        });

        // Изменение статуса сигнала
        function setStatus(id, status) {
            socket.emit('update_status', { id, status });
        }

        // Удаление сигнала
        function deleteSignal(id) {
            if(confirm('Точно удалить этот сигнал из истории у всех подписчиков?')) {
                socket.emit('delete_signal', id);
            }
        }

        function getStatusLabel(status) {
            switch(status) {
                case 'win': return '<span class="text-green-400 font-bold text-xs">✅ Выигрыш</span>';
                case 'loss': return '<span class="text-red-400 font-bold text-xs">❌ Проигрыш</span>';
                case 'refund': return '<span class="text-blue-400 font-bold text-xs">🔄 Возврат</span>';
                default: return '<span class="text-yellow-400 font-bold text-xs">⏳ В игре</span>';
            }
        }

        // Отрисовка истории в админке
        socket.on('history_update', (history) => {
            document.getElementById('adminHistoryCount').innerText = history.length;
            const list = document.getElementById('adminHistoryList');

            if (history.length === 0) {
                list.innerHTML = '<div class="bg-gray-800 rounded-xl p-6 text-center text-gray-400 border border-gray-700">История сигналов пуста</div>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 shadow">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs text-gray-400">${item.time}</span>
                            <h3 class="font-bold text-base text-white">${item.match}</h3>
                            <p class="text-sm text-gray-300 mt-1">Ставка: <b class="text-white">${item.bet}</b> | КФ: <b class="text-green-400">${item.odds}</b> | Сумма: <b class="text-yellow-300">${item.amount}</b></p>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            ${getStatusLabel(item.status)}
                            <button onclick="deleteSignal('${item.id}')" class="text-xs text-gray-500 hover:text-red-400">🗑 Удалить</button>
                        </div>
                    </div>

                    <!-- Кнопки управления результатом -->
                    <div class="grid grid-cols-4 gap-2 mt-4 pt-3 border-t border-gray-700">
                        <button onclick="setStatus('${item.id}', 'win')" class="bg-green-600/20 hover:bg-green-600/40 text-green-300 border border-green-500/30 py-1.5 rounded-lg text-xs font-semibold transition">✅ Плюс</button>
                        <button onclick="setStatus('${item.id}', 'loss')" class="bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/30 py-1.5 rounded-lg text-xs font-semibold transition">❌ Минус</button>
                        <button onclick="setStatus('${item.id}', 'refund')" class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 border border-blue-500/30 py-1.5 rounded-lg text-xs font-semibold transition">🔄 Возврат</button>
                        <button onclick="setStatus('${item.id}', 'pending')" class="bg-yellow-600/20 hover:bg-yellow-600/40 text-yellow-300 border border-yellow-500/30 py-1.5 rounded-lg text-xs font-semibold transition">⏳ В игре</button>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
